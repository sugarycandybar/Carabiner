app-id: io.github.sugarycandybar.Carabiner
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: carabiner
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - python3-requirements.json
  - name: carabiner
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/sugarycandybar/Carabiner.git
        commit: a4ad053a6b973aebadf089a629860c814d77ecd1
